[pytest]
DJANGO_SETTINGS_MODULE = ga.settings
pythonpath = .
python_files = test_*.py
python_classes = Test* *Test *Tests
python_functions = test_*
markers =
    unit: pure logic tests, no Django ORM or database needed (run with: pytest -m unit)
    integration: Django ORM/database tests (run with: pytest -m integration)
    e2e: browser/Playwright end-to-end tests (run with: pytest -m e2e)
    http: pure HTTP tests against a running server, no Django import (run with: pytest -m http)
    playwright: marks tests as playwright e2e tests (run with: pytest -m playwright)
    slow: marks tests as slow (deselect with: pytest -m "not slow")
addopts = --tb=short --strict-markers --import-mode=importlib
