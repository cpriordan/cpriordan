[pytest]
# Pytest configuration for login tests with 2FA

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    login: marks tests that require authentication with 2FA
    asyncio: marks async tests
    regression: tests included in the STG regression suite

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Test timeout (optional, requires pytest-timeout)
# timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
