name: PROD Daily OneAZ Business Ad Playwright Test

on:
  schedule:
    - cron: '0 14 * * *'  # Runs daily at 6:00 AM PST (14:00 UTC)
  workflow_dispatch:    # Allows manual triggering

jobs:
  run-playwright-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install --with-deps

    - name: Run Playwright script
      run: python fin-tests/PROD/test_oneaz_business_prodtags_and_js_errors_on_chrome_for_github_actions_PROD.py

    - name: Upload latest screenshots artifact
      run: |
        latest_dir=$(ls -td fin-tests/PROD/screenshots_oneaz_* | head -1)
        echo "Latest screenshots directory: $latest_dir"
        echo "LATEST_SCREENSHOT_DIR=$latest_dir" >> $GITHUB_ENV

    - name: Upload screenshots artifact
      uses: actions/upload-artifact@v4
      with:
        name: latest-oneaz-screenshots
        path: ${{ env.LATEST_SCREENSHOT_DIR }}
        if-no-files-found: warn
