# =====================
# File: .github/workflows/PROD-MissionFed-Funnel-Scenarios.yml
# =====================
# FIXES (2025-10-05)
# - Adds BASELINE_DIR env so tests can find baseline images reliably in CI.
# - Keeps pytest-html + pytest-metadata for HTML report.
# - Installs Playwright browsers.

name: PROD - MissionFed Funnel Scenarios

on:
  workflow_dispatch: {}
  schedule:
    # Every day at 09:10 UTC (02:10 PT approx). Adjust as you like.
    - cron: "10 9 * * *"

jobs:
  run-prod-scenarios:
    runs-on: ubuntu-latest

    env:
      MF_ENV: prod
      MF_SWAP_ASSETS: "0"
      MF_HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
      MF_RMS_TOL: "45"
      # NEW: Tell the test where the baseline images live (adjust if your repo uses a different path)
      BASELINE_DIR: ${{ github.workspace }}/fin-tests/PROD/baseline_images_for_comparison

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps (pytest, asyncio, playwright, pillow, pytest-html)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pillow playwright pytest-html pytest-metadata
          # If you have a requirements.txt: pip install -r requirements.txt

      - name: Install Playwright browsers & OS deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tests (PROD)
        run: |
          # Optional: clean previous screenshots if repo carries artifacts
          rm -rf tests/screen* || true
          echo "Using BASELINE_DIR=$BASELINE_DIR" && ls -la "$BASELINE_DIR" || true
          # Generate an HTML report
          # Comment out env
          #  --env prod \
          pytest -q fin-tests/PROD/test_missionfed_funnel_scenarios_github_actions_PROD.py \
            --maxfail=1 \
            --disable-warnings \
            --html=playwright_report_prod.html --self-contained-html

      - name: Upload screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-screenshots
          path: |
            tests/screen**
            **/screenshots_*_using_pytest/**
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-report
          path: playwright_report_prod.html
          if-no-files-found: warn



