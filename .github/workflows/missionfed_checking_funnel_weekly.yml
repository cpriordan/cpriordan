name: MissionFed Checking Funnel Test - Weekly

on:
  # Run every Monday at 6:00 AM PST (14:00 UTC)
  schedule:
    - cron: '0 14 * * 1'

  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: false
        default: 'PROD'
        type: choice
        options:
          - PROD
          - STG

jobs:
  test-missionfed-checking-funnel:
    name: MissionFed Checking Account Funnel Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    env:
      # Default timeout for Playwright operations (10 seconds)
      DEFAULT_TIMEOUT: 10000
      # Test environment
      TEST_ENVIRONMENT: ${{ github.event.inputs.environment || 'PROD' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactored_tests

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-html playwright python-dotenv pillow

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Create screenshots directory
        run: |
          mkdir -p screenshots_missionfed_using_pytest

      - name: Run MissionFed Checking Funnel Test
        id: test-run
        continue-on-error: true
        run: |
          echo "Running MissionFed Checking Account Funnel Test..."
          python -m pytest fin-tests/test_missionfed_checking_funnel_scenario_PROD.py \
            -v \
            -s \
            --tb=short \
            --html=test-report.html \
            --self-contained-html \
            --maxfail=1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: test-report.html
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots_missionfed_using_pytest/
          retention-days: 30

      - name: Upload page source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-source-${{ github.run_number }}
          path: |
            screenshots_missionfed_using_pytest/**/*.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Check test results
        if: steps.test-run.outcome == 'failure'
        run: |
          echo "::error::MissionFed Checking Funnel Test failed!"
          echo "::notice::Check the uploaded artifacts for screenshots and logs"
          exit 1

      - name: Test passed
        if: steps.test-run.outcome == 'success'
        run: |
          echo "::notice::MissionFed Checking Funnel Test passed successfully!"
          echo "All test steps completed without errors."
