name: URL Categorizer Tests — STG

on:
  workflow_dispatch:

  schedule:
    - cron: '0 15 * * 1-5'  # weekdays at 7 AM PST (15:00 UTC)

jobs:
  known-cases:
    name: Known Cases (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests pytest

      - name: Run known-cases and endpoint shape tests
        env:
          TEST_BASE_URL: https://stgfinalyticsdata.com
        run: |
          python -m pytest \
            pytests/CATEGORIZER_TESTS/tests/getads/test_url_categorizer_endpoint_http.py::TestEndpointShape \
            pytests/CATEGORIZER_TESTS/tests/getads/test_url_categorizer_endpoint_http.py::TestEndpointKnownCases \
            -m http -v --noconftest -s

  corpus-precision:
    name: Full Corpus Precision (~2 min)
    runs-on: ubuntu-latest
    needs: known-cases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests pytest

      - name: Run full corpus precision test
        env:
          TEST_BASE_URL: https://stgfinalyticsdata.com
        run: |
          python -m pytest \
            pytests/CATEGORIZER_TESTS/tests/getads/test_url_categorizer_endpoint_http.py::TestEndpointMatchesCorpus \
            -m http -v --noconftest -s
