# Hero OCR CI (no SMTP needed — uses GitHub's failure email + artifacts)
# NOTE: Ensures Playwright browsers are installed (fixes "Executable doesn't exist" error)
name: Hero OCR CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}  # manual run
  # Daily run at 5 am PST (cron is UTC)
  schedule:
    - cron: "0 13 * * *"  # ~5 AM US Pacific during DST (adjust as needed)

jobs:
  test:
    runs-on: ubuntu-22.04  # CHANGED: pin runner to 22.04 to avoid libasound2 rename issue on 24.04
    timeout-minutes: 30

    env:
      HEADLESS: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps (Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python deps (Pillow, Playwright, PyTest, pytesseract)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure required libs are present even if not pinned in requirements.txt:
          pip install pillow pytesseract pytest pytest-asyncio playwright

      # CHANGED: Install Playwright browsers unconditionally to prevent launch errors
      - name: Install Playwright browsers (CHANGED)
        # CHANGED: Works reliably on Ubuntu 22.04. On 24.04 the libasound2 package was renamed (to libasound2t64),
        # causing the Playwright deps script to fail. Pinning the runner above fixes this.
        run: |
          python -m playwright install --with-deps chromium

      - name: Run pytest (capture log for artifacts)
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest -q -s fin-tests/PROD -k test_oneaz_hero_ocr_ci --maxfail=1 --disable-warnings | tee artifacts/pytest.log

      # Upload artifacts on every run so you still get logs if collection/import fails
      - name: Upload test artifacts (screenshots + sources + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          if-no-files-found: warn
          path: |
            **/screenshots_*_using_pytest/**
            **/*_source.html
            **/homepage_source.html
            **/homepage_screenshot.png
            **/product_page_for_ad_screenshot.png
            **/hero_ad_only.png
            artifacts/pytest.log
