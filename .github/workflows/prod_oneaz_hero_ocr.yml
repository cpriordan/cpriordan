# NEW: GitHub Actions workflow to run OCR-only hero test with Playwright + Tesseract
name: Hero OCR CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Force headless in CI
      HEADLESS: "true"
      # OPTIONAL: If your site requires basic auth, store these in repo secrets
      BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
      BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (Tesseract)
        run: |
          sudo apt-get update
          # CHANGED: ensure English language data is present
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install pytest pytest-asyncio playwright pillow pytesseract

      - name: Install Playwright browsers + deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tests
        # CHANGED: correct test path (repo contains fin-tests/, not tests/fin-tests/)
        run: |
          pytest -q -s fin-tests/PROD -k test_oneaz_hero_ocr_ci --maxfail=1 --disable-warnings

      - name: Upload screenshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          # CHANGED: broaden patterns so we capture outputs from fin-tests tree
          path: |
            **/screenshots_*_using_pytest/**
            **/homepage_source.html
          if-no-files-found: ignore
