name: Fin Backend Regression Tests — STG

# ── Triggers ──────────────────────────────────────────────────────────────────
#
# Manual only — these tests perform live 2FA logins into the GOCU and VYS
# admin portals and exercise real admin workflows (campaigns, content,
# media library, etc.) on STG.
#
on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options: [stg]
        default: stg

concurrency:
  group: fin-backend-regression-tests-${{ github.event.inputs.env || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-regression:
    name: Backend Regression Suite (${{ github.event.inputs.env || 'stg' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      TEST_ENVIRONMENT: ${{ github.event.inputs.env || 'stg' }}
      HEADLESS: "true"
      DEFAULT_TIMEOUT: "40000"
      FINDATA_GOCU_USER: ${{ secrets.FINDATA_GOCU_USER }}
      FINDATA_GOCU_PW: ${{ secrets.FINDATA_GOCU_PW }}
      FINDATA_GOCU_OTP: ${{ secrets.FINDATA_GOCU_OTP }}
      FINDATA_VYS_USER: ${{ secrets.FINDATA_VYS_USER }}
      FINDATA_VYS_PW: ${{ secrets.FINDATA_VYS_PW }}
      FINDATA_VYS_OTP: ${{ secrets.FINDATA_VYS_OTP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactored_tests

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest-html

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run backend regression suite
        id: run_tests
        run: |
          pytest \
            pytests/ADMINSITETESTS/test_findata_stg_gocu_basic_login_using_2fa.py \
            pytests/ADMINSITETESTS/test_findata_stg_login_gocu_basic_admin_account_access.py \
            pytests/ADMINSITETESTS/test_findata_stg_login_vys_admin_account_analytics_personalization_funnel_report_looker.py \
            pytests/ADMINSITETESTS/test_findata_stg_login_vys_admin_account_claritas_segment_controls_demo_site_ads.py \
            pytests/ADMINSITETESTS/test_findata_stg_login_vys_admin_account_connect_to_a_campaign.py \
            pytests/ADMINSITETESTS/test_findata_stg_login_vys_admin_account_instant_copy.py \
            pytests/ADMINSITETESTS/test_findata_stg_login_vys_admin_account_media_library.py \
            pytests/ADMINSITETESTS/test_findata_stg_login_vys_admin_account_products_ordering_controls_demo_site_ads.py \
            pytests/ADMINSITETESTS/test_findata_stg_login_vys_admin_account_segment_an_existing_content.py \
            -v --tb=short \
            --reruns 1 --reruns-delay 15 \
            --junitxml=backend_regression_results.xml \
            --html=backend_regression_report.html --self-contained-html \
            -p no:warnings
        continue-on-error: true

      - name: Write step summary
        if: always()
        run: |
          echo "## Backend Regression Suite (${{ env.TEST_ENVIRONMENT }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run_tests.outcome }}" == "success" ]; then
            echo "✅ **PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED** — download the HTML report artifact for details" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report + JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-report-${{ env.TEST_ENVIRONMENT }}
          path: |
            backend_regression_report.html
            backend_regression_results.xml
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-screenshots-${{ env.TEST_ENVIRONMENT }}
          path: pytests/ADMINSITETESTS/screenshots_adminsite_using_pytest/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
