name: Statewide OLB Card Ad CTA Links — PROD

on:
  # Manual trigger (run on demand from the Actions tab)
  workflow_dispatch:
    inputs:
      products:
        description: 'Comma-separated product names to test (leave blank for all)'
        required: false
        type: string
        default: ''

  # Scheduled: daily at 7 AM PST (15:00 UTC)
  # DISABLE SINCE NO PROD ACCOUNT
  #schedule:
  #  - cron: '0 15 * * 1-5'   # weekdays only

  # Trigger when the test file or workflow itself changes
  push:
    paths:
      - 'fin-tests/PROD/test_statewide_olb_card_ad_go_to_cta_links_github_actions_PROD.py'
      - '.github/workflows/statewide_olb_cta_links_PROD.yml'

  pull_request:
    paths:
      - 'fin-tests/PROD/test_statewide_olb_card_ad_go_to_cta_links_github_actions_PROD.py'
      - '.github/workflows/statewide_olb_cta_links_PROD.yml'

jobs:
  statewide-cta-links:
    name: Statewide OLB CTA Links PROD
    # runs-on: ubuntu-latest
    runs-on: ubuntu-22.04  # downgrade from ubuntu-latest / ubuntu-24.04
    timeout-minutes: 30

    env:
      # Secrets — configure these in Settings → Secrets → Actions
      STATEWIDE_USERNAME:    ${{ secrets.STATEWIDE_USERNAME }}
      STATEWIDE_PASSWORD:    ${{ secrets.STATEWIDE_PASSWORD }}
      STATEWIDE_OTP_SECRET:  ${{ secrets.STATEWIDE_OTP_SECRET }}
      # Set to "true" if the PROD test account has no 2FA
      STATEWIDE_SKIP_2FA:    ${{ vars.STATEWIDE_SKIP_2FA || 'false' }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install playwright pytest pytest-asyncio pytest-html pyotp
          # Install pytest playwright instead
          pip install pytest-playwright pytest-asyncio pytest-html pyotp
          # Install requirements.txt if it exists at repo root
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      # ── Pre-flight ──────────────────────────────────────────────────────────
      - name: Verify credentials are set
        run: |
          if [ -z "$STATEWIDE_USERNAME" ]; then
            echo "::error::STATEWIDE_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "$STATEWIDE_PASSWORD" ]; then
            echo "::error::STATEWIDE_PASSWORD secret is not set"
            exit 1
          fi
          echo "Credentials found — proceeding"

      - name: Display trigger info
        run: |
          echo "Triggered by : ${{ github.event_name }}"
          echo "Branch       : ${{ github.ref_name }}"
          echo "Runner OS    : ${{ runner.os }}"
          echo "Skip 2FA     : ${{ env.STATEWIDE_SKIP_2FA }}"
          if [ -n "${{ inputs.products }}" ]; then
            echo "Products     : ${{ inputs.products }}"
          else
            echo "Products     : all"
          fi

      # ── Run test ────────────────────────────────────────────────────────────
      - name: Run Statewide OLB CTA links test
        id: run_test
        run: |
          pytest fin-tests/PROD/test_statewide_olb_card_ad_go_to_cta_links_github_actions_PROD.py \
            -v \
            --tb=short \
            --html=statewide_cta_links_report.html \
            --self-contained-html \
            -p no:warnings
        continue-on-error: true   # upload artifacts even on failure

      # ── Artifacts ───────────────────────────────────────────────────────────
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statewide-cta-links-report
          path: statewide_cta_links_report.html
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statewide-cta-links-screenshots
          path: statewide/olb_PROD/cta_links/
          retention-days: 14
          if-no-files-found: warn

      # ── Final status ────────────────────────────────────────────────────────
      - name: Report final status
        if: always()
        run: |
          if [ "${{ steps.run_test.outcome }}" == "success" ]; then
            echo "::notice::✅ All Statewide OLB CTA links PASSED"
            exit 0
          else
            echo "::error::❌ One or more Statewide OLB CTA links FAILED — download the HTML report artifact for details"
            exit 1
          fi
